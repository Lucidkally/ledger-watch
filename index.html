<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger Watch</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mut:#5b6784;--line:#d5dbe8;--acc:#2547d0;--ai:#fff;--ok:#12703a;--okb:#dff3e6;--wn:#8a5300;--wnb:#fdf0d3;--bd:#b3261e;--bdb:#fbe3e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1526;--card:#182038;--ink:#e8ecf7;--mut:#9aa6c4;--line:#2b3556;--acc:#7f9bff;--ai:#0f1526;--ok:#6fd49a;--okb:#123a25;--wn:#f0b752;--wnb:#3d2d0c;--bd:#ff8f86;--bdb:#4a1a17}}
:root[data-theme="dark"]{--bg:#0f1526;--card:#182038;--ink:#e8ecf7;--mut:#9aa6c4;--line:#2b3556;--acc:#7f9bff;--ai:#0f1526;--ok:#6fd49a;--okb:#123a25;--wn:#f0b752;--wnb:#3d2d0c;--bd:#ff8f86;--bdb:#4a1a17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;margin:0 0 8px;font-weight:600}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{font:600 20px Georgia,serif;display:flex;align-items:center;gap:8px}
.chain{display:inline-flex}.chain i{width:10px;height:14px;border:2px solid var(--acc);border-radius:3px;margin-right:-3px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut)}.sc{overflow-x:auto}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
button{font:inherit;padding:8px 13px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:var(--ai);border-color:var(--acc);font-weight:600;margin-top:12px}
button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
button.s{padding:4px 9px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.b{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.Pending,.Returned,.Amended,.NotFound{background:var(--wnb);color:var(--wn)}
.Compiled,.Approved,.Authentic{background:var(--okb);color:var(--ok)}
.Altered{background:var(--bdb);color:var(--bd)}
code,.h{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}
.verdict{border-radius:10px;padding:14px;margin-bottom:12px;font:600 20px Georgia,serif}
.verdict.Authentic{background:var(--okb);color:var(--ok)}.verdict.Altered{background:var(--bdb);color:var(--bd)}.verdict.NotFound{background:var(--wnb);color:var(--wn)}
.hs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.hs div{border:1px solid var(--line);border-radius:8px;padding:10px}
.blocks{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
.blk{flex:0 0 150px;border:2px solid var(--acc);border-radius:8px;padding:8px;margin-right:18px;position:relative;background:var(--card)}
.blk:not(:last-child):after{content:"";position:absolute;right:-20px;top:50%;width:18px;border-top:3px solid var(--acc)}
.blk.bad{border-color:var(--bd)}
.msg{padding:8px 12px;border-radius:6px;background:var(--wnb);color:var(--wn);margin-bottom:12px}
.chips button{margin:4px 4px 0 0}
@media print{header,.noprint,button{display:none!important}body,.card{background:#fff!important;color:#000!important}.card{border:0;padding:0}}
</style></head><body>
<header><div class="brand"><span class="chain"><i></i><i></i><i></i></span>Ledger Watch</div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),enc=new TextEncoder();
async function sha(t){const b=await crypto.subtle.digest('SHA-256',enc.encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SESSION='2025/2026',FEE=50000;
const gradeOf=s=>s>=70?'A':s>=60?'B':s>=50?'C':s>=45?'D':s>=40?'E':'F';
const short=h=>h.slice(0,10)+'…'+h.slice(-6);
const recData=r=>[r.studentId,r.courseId,r.score,r.grade,r.session,r.semester,r.ts].join('|');
const certData=c=>'CERT|'+c.studentId+'|'+c.date;
let DB,me=null,view='login',tab='',vres=null,msg='',chainMsg='',editId=null;
const stu=id=>DB.students.find(s=>s.id==id),crs=id=>DB.courses.find(c=>c.id==id);
const save=()=>{try{localStorage.setItem('lw3',JSON.stringify(DB))}catch(e){}};
async function mine(data,prev){let n=0,h;while(!(h=await sha(data+prev+n)).startsWith('00'))n++;return{nonce:n,hash:h}}
async function addBlock(data){const prev=DB.blocks[DB.blocks.length-1].hash,m=await mine(data,prev);const b={id:DB.blocks.length+1,prev,ts:new Date().toISOString().slice(0,19).replace('T',' '),data,...m};DB.blocks.push(b);return b}
async function commit(r,by){r.status='Approved';r.approvedBy=by;const b=await addBlock(recData(r));r.hash=b.hash;r.blockId=b.id;r.status='Compiled'}
async function seed(){
 const pw=await sha('demo123');
 DB={users:[['lecturer','Lecturer','Dr. A. Okon'],['hod','HOD','Prof. E. Bassey'],['records','RecordsUnit','Mrs. I. Effiong'],['admin','Admin','System Admin']].map((u,i)=>({id:i+1,username:u[0],pw,role:u[1],name:u[2]})),
 students:[['24/CSC/005','Andy Edet'],['24/CSC/012','Grace Ita'],['24/CSC/019','Ubong Ekpo'],['24/CSC/027','Blessing Etim']].map((s,i)=>({id:i+1,matric:s[0],name:s[1],dept:'Computer Science',level:'400',pw})),
 courses:[['CSC401','Software Engineering',3],['CSC405','Cybersecurity',3],['CSC409','Distributed Systems',3],['CSC411','Database Systems',2]].map((c,i)=>({id:i+1,code:c[0],title:c[1],units:c[2]})),
 results:[],certs:[],log:[],blocks:[],audit:[],payments:[1,2,3].map(i=>({id:i,studentId:i,session:SESSION,amount:FEE,ref:'RCT-DEMO'+i,at:'2026-08-20 09:00'})),regs:[[1,2],[2,1],[3,3]].map((x,i)=>({id:i+1,studentId:x[0],courseId:x[1],session:SESSION}))};
 const g=await mine('Genesis','0'.repeat(64));DB.blocks.push({id:1,prev:'0'.repeat(64),ts:'2026-01-01 00:00:00',data:'Genesis',...g});
 for(const [s,c,sc] of [[1,2,78],[2,1,64]]){const r={id:DB.results.length+1,studentId:s,courseId:c,score:sc,grade:gradeOf(sc),session:'2025/2026',semester:'First',ts:'2026-09-01 10:00',status:'Pending'};DB.results.push(r);await commit(r,2)}
 DB.results.push({id:3,studentId:3,courseId:3,score:55,grade:'C',session:'2025/2026',semester:'First',ts:'2026-09-02 11:30',status:'Pending'});save()}
async function init(){try{const s=localStorage.getItem('lw3');if(s)DB=JSON.parse(s)}catch(e){}if(!DB)await seed();DB.audit=DB.audit||[];render()}
function render(){
 const nav=me?`<span class="mut">${esc(me.name)} (${me.role})</span><button class="${view=='dash'?'on':''}" onclick="go('dash')">Dashboard</button><button class="${view=='verify'?'on':''}" onclick="go('verify')">Verify</button><button onclick="me=null;go('login')">Log out</button>`:`<button class="${view=='login'?'on':''}" onclick="go('login')">Log in</button><button class="${view=='verify'?'on':''}" onclick="go('verify')">Verify a record</button>`;
 $('#nav').innerHTML=nav;
 $('#app').innerHTML=(msg?`<div class="msg">${esc(msg)}</div>`:'')+(view=='login'?loginV():view=='verify'?verifyV():dashV());msg='';fillCourses()}
function go(v){view=v;vres=null;render()}
function loginV(){return`<div class="card"><h2>Log in</h2><p class="mut">Staff use their username. Students use their matric number. Demo password for every account: <b>demo123</b>.</p>
<label>Username or matric number</label><input id="lu" autocomplete="off"><label>Password</label><input id="lp" type="password">
<button class="p" onclick="doLogin()">Log in</button>
<div class="chips"><p class="mut" style="margin:14px 0 0">Try a role (the last two are students, one paid and one unpaid):</p>${['lecturer','hod','records','admin','24/CSC/005','24/CSC/027'].map(u=>`<button class="s" onclick="$('#lu').value='${u}';$('#lp').value='demo123'">${u}</button>`).join('')}</div></div>
<div class="card"><h3>Employer or verifier?</h3><p class="mut">You don't need an account. Use “Verify a record” above to check a result or certificate.</p></div>`}
async function doLogin(){const un=$('#lu').value.trim();let u=DB.users.find(x=>x.username===un);if(!u){const st=DB.students.find(x=>x.matric.toLowerCase()===un.toLowerCase());if(st)u={id:'S'+st.id,role:'Student',name:st.name,pw:st.pw,sid:st.id}}if(!u||await sha($('#lp').value)!==u.pw){msg='Invalid login. Check your username and password.';return render()}me=u;view='dash';tab='';render()}
const resTable=(rows,act)=>`<div class="sc"><table><tr><th>ID</th><th>Student</th><th>Course</th><th>Score</th><th>Grade</th><th>Status</th><th>Block</th>${act?'<th></th>':''}</tr>${rows.map(r=>`<tr><td>RES-${r.id}</td><td>${esc(stu(r.studentId).name)}</td><td>${crs(r.courseId).code}</td><td>${r.score}${r.amend?` <span class="mut">(was ${r.amend.o.score}, ${r.amend.o.grade})</span>`:''}</td><td>${r.grade}</td><td><span class="b ${r.status}">${r.status}</span></td><td>${r.blockId||'-'}</td>${act?`<td>${act(r)}</td>`:''}</tr>`).join('')||'<tr><td colspan="8" class="mut">Nothing here yet.</td></tr>'}</table></div>`;
function dashV(){
 if(!me)return loginV();
 if(me.role=='Student')return studentV();
 if(me.role=='Lecturer')return`<div class="card"><h2>Enter a course result</h2><p class="mut">Only courses the student has registered can be graded.</p><div class="row"><div><label>Student</label><select id="rs" onchange="fillCourses()">${DB.students.map(s=>`<option value="${s.id}">${s.matric} ${esc(s.name)}</option>`).join('')}</select></div><div><label>Course</label><select id="rc"></select></div><div><label>Score (0-100)</label><input id="rsc" type="number" min="0" max="100" oninput="$('#gr').textContent=this.value===''?'-':gradeOf(+this.value)"></div><div><label>Grade (auto)</label><div id="gr" style="padding:9px 0;font-weight:700">-</div></div><div><label>Session</label><input id="rse" value="${SESSION}" readonly></div><div><label>Semester</label><select id="rsm"><option>First</option><option>Second</option></select></div></div><button class="p" onclick="addResult()">Submit for approval</button></div><div class="card"><h3>Submitted results</h3>${resTable(DB.results)}</div>`;
 if(me.role=='HOD')return`<div class="card"><h2>Results awaiting approval</h2><p class="mut">Approving locks the result onto the blockchain automatically.</p>${resTable(DB.results.filter(r=>r.status=='Pending'),r=>`<button class="s" onclick="approve(${r.id})">Approve</button> <button class="s" onclick="reject(${r.id})">Reject</button>`)}</div>${editId?editV():''}<div class="card"><h3>Approved results</h3><p class="mut">Change a grade if a result was wrong. The Records Unit must approve the change before it counts.</p>${resTable(DB.results.filter(r=>r.status=='Compiled'),r=>`<button class="s" onclick="editId=${r.id};render()">Change grade</button>`)}</div>${DB.results.some(r=>r.status=='Amended')?`<div class="card"><h3>Waiting for Records Unit</h3>${resTable(DB.results.filter(r=>r.status=='Amended'))}</div>`:''}${auditV()}`;
 if(me.role=='RecordsUnit')return`<div class="card"><h2>Changes awaiting your approval</h2><p class="mut">The HOD changed these grades. Approve to lock the new grade onto the blockchain, or reject to restore the original.</p>${resTable(DB.results.filter(r=>r.status=='Amended'),r=>`<button class="s" onclick="approveAmend(${r.id})">Approve change</button> <button class="s" onclick="rejectAmend(${r.id})">Reject</button>`)}</div><div class="card"><h2>Compiled results</h2>${resTable(DB.results.filter(r=>r.status=='Compiled'))}</div><div class="card"><h3>Issue a certificate</h3><div class="row"><select id="cs">${DB.students.map(s=>`<option value="${s.id}">${s.matric} ${esc(s.name)}</option>`).join('')}</select><button onclick="issue()">Issue and lock on blockchain</button></div><div class="sc" style="margin-top:10px"><table><tr><th>ID</th><th>Student</th><th>Issued</th><th>Block</th></tr>${DB.certs.map(c=>`<tr><td>CERT-${c.id}</td><td>${esc(stu(c.studentId).name)}</td><td>${c.date}</td><td>${c.blockId}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">No certificates issued yet.</td></tr>'}</table></div></div>${auditV()}`;
 return`<div class="card"><h2>Blockchain ledger</h2><div class="blocks">${DB.blocks.map(b=>`<div class="blk ${chainMsg&&chainMsg.bad&&chainMsg.bad.includes(b.id)?'bad':''}"><b>Block ${b.id}</b><div class="mut" style="font-size:12px">${b.ts}</div><div class="h">prev ${short(b.prev)}</div><div class="h">hash ${short(b.hash)}</div><div class="mut" style="font-size:12px">nonce ${b.nonce}</div></div>`).join('')}</div>
${chainMsg?`<div class="msg" style="margin-top:10px;${chainMsg.bad.length?'background:var(--bdb);color:var(--bd)':'background:var(--okb);color:var(--ok)'}">${chainMsg.t}</div>`:''}
<button onclick="checkChain()">Check chain integrity</button> <button onclick="tamper()">Simulate database tampering</button> <button onclick="resetDemo()">Reset demo</button>
<p class="mut">Tampering changes a score directly in the database. Unlike a HOD change, it has no reason, no approval and no audit entry, so verifying RES-1 in the portal flags it as Altered.</p></div>
${auditV()}<div class="card"><h3>Verification log</h3><div class="sc"><table><tr><th>#</th><th>Record</th><th>Verifier</th><th>Checked</th><th>Result</th></tr>${DB.log.map(l=>`<tr><td>${l.id}</td><td>${esc(l.rec)}</td><td>${esc(l.who)}</td><td>${l.at}</td><td><span class="b ${l.res}">${l.res}</span></td></tr>`).join('')||'<tr><td colspan="5" class="mut">No verification attempts yet.</td></tr>'}</table></div></div>`}
async function addResult(){const sc=$('#rsc').value;if(sc===''||sc<0||sc>100){msg='Enter a score between 0 and 100.';return render()}
 const sid=+$('#rs').value,cid=+$('#rc').value;if(!cid||!isReg(sid,cid)){msg='This student has not registered that course, so a result cannot be recorded.';return render()}
 DB.results.push({id:DB.results.length+1,studentId:+$('#rs').value,courseId:+$('#rc').value,score:+sc,grade:gradeOf(+sc),session:$('#rse').value,semester:$('#rsm').value,ts:new Date().toISOString().slice(0,16).replace('T',' '),status:'Pending'});save();msg='Result submitted. It is now waiting for HOD approval.';render()}
async function approve(id){const r=DB.results.find(x=>x.id==id);await commit(r,me.id);save();msg='RES-'+id+' approved and locked in block '+r.blockId+'.';render()}
function reject(id){DB.results.find(x=>x.id==id).status='Returned';save();msg='RES-'+id+' returned to the lecturer.';render()}
async function issue(){const c={id:DB.certs.length+1,studentId:+$('#cs').value,date:new Date().toISOString().slice(0,10)};const b=await addBlock(certData(c));c.hash=b.hash;c.blockId=b.id;DB.certs.push(c);save();msg='CERT-'+c.id+' issued and locked in block '+b.id+'.';render()}
async function checkChain(){const bad=[];for(let i=0;i<DB.blocks.length;i++){const b=DB.blocks[i];if(await sha(b.data+b.prev+b.nonce)!==b.hash||(i&&b.prev!==DB.blocks[i-1].hash))bad.push(b.id)}chainMsg={bad,t:bad.length?'Chain broken at block(s) '+bad.join(', ')+'.':'All '+DB.blocks.length+' blocks are linked and intact.'};render()}
function tamper(){const r=DB.results.find(x=>x.status=='Compiled');if(!r)return;r.score=Math.min(100,r.score+10);save();msg='RES-'+r.id+' score changed in the database to '+r.score+'. The blockchain still holds the original.';render()}
async function resetDemo(){localStorage.removeItem('lw3');DB=null;chainMsg='';await seed();msg='Demo reset.';render()}
const now=()=>new Date().toISOString().slice(0,16).replace('T',' ');
const audit=(action,r,o,n,reason)=>DB.audit.unshift({at:now(),resId:r.id,action,by:me.name,role:me.role,o,n,reason});
const auditV=()=>`<div class="card"><h3>Audit trail</h3><p class="mut">Every authorised change to an approved result, and who made it.</p><div class="sc"><table><tr><th>When</th><th>Result</th><th>Action</th><th>By</th><th>Change</th><th>Reason</th></tr>${DB.audit.map(a=>`<tr><td>${a.at}</td><td>RES-${a.resId}</td><td>${a.action}</td><td>${esc(a.by)} (${a.role})</td><td>${a.o.score} (${a.o.grade}) → ${a.n.score} (${a.n.grade})</td><td style="white-space:normal">${esc(a.reason||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">No changes recorded yet.</td></tr>'}</table></div></div>`;
const editV=()=>{const r=DB.results.find(x=>x.id==editId);return`<div class="card"><h3>Change grade for RES-${r.id}</h3><p class="mut">${esc(stu(r.studentId).name)}, ${crs(r.courseId).code}. Current: ${r.score} (${r.grade}).</p><div class="row"><div><label>New score</label><input id="es" type="number" min="0" max="100" value="${r.score}" oninput="$('#eg').value=gradeOf(+this.value)"></div><div><label>New grade</label><select id="eg">${'ABCDEF'.split('').map(g=>`<option ${g==r.grade?'selected':''}>${g}</option>`).join('')}</select></div></div><label>Reason (required)</label><input id="er" placeholder="e.g. Script re-marked after student appeal"><button class="p" onclick="saveEdit()">Save change</button> <button onclick="editId=null;render()">Cancel</button></div>`};
function saveEdit(){const r=DB.results.find(x=>x.id==editId),sc=$('#es').value,g=$('#eg').value,why=$('#er').value.trim();
 if(sc===''||sc<0||sc>100||!why){msg='Enter a score from 0 to 100 and a reason.';return render()}
 if(+sc===r.score&&g===r.grade){msg='Nothing changed. Enter a different score or grade.';return render()}
 const o={score:r.score,grade:r.grade},n={score:+sc,grade:g};
 r.amend={o,n};r.score=n.score;r.grade=n.grade;r.status='Amended';audit('Changed',r,o,n,why);editId=null;save();msg='Change saved for RES-'+r.id+'. It now waits for Records Unit approval.';render()}
async function approveAmend(id){const r=DB.results.find(x=>x.id==id),a=r.amend;await commit(r,me.id);audit('Re-approved',r,a.o,a.n,'');delete r.amend;save();msg='Change to RES-'+id+' approved and locked in block '+r.blockId+'.';render()}
function rejectAmend(id){const r=DB.results.find(x=>x.id==id),a=r.amend;r.score=a.o.score;r.grade=a.o.grade;r.status='Compiled';audit('Rejected',r,a.n,a.o,'');delete r.amend;save();msg='Change to RES-'+id+' rejected. The original grade is restored.';render()}
const isPaid=id=>DB.payments.some(p=>p.studentId==id&&p.session==SESSION);
const isReg=(sid,cid)=>DB.regs.some(r=>r.studentId==sid&&r.courseId==cid&&r.session==SESSION);
const regCourses=sid=>DB.courses.filter(c=>isReg(sid,c.id));
const hasRes=(sid,cid)=>DB.results.some(r=>r.studentId==sid&&r.courseId==cid&&r.session==SESSION&&r.status!='Returned');
function fillCourses(){const el=$('#rc');if(!el)return;const sid=+$('#rs').value;el.innerHTML=regCourses(sid).filter(c=>!hasRes(sid,c.id)).map(c=>`<option value="${c.id}">${c.code} ${c.title}</option>`).join('')||'<option value="">No registered courses to grade</option>'}
function pay(){DB.payments.push({id:DB.payments.length+1,studentId:me.sid,session:SESSION,amount:FEE,ref:'RCT-'+Math.random().toString(36).slice(2,8).toUpperCase(),at:now()});save();msg='Payment received. You can now register your courses.';render()}
function regC(cid){if(!isPaid(me.sid)){msg='Pay your school fees first.';return render()}DB.regs.push({id:DB.regs.length+1,studentId:me.sid,courseId:cid,session:SESSION});save();render()}
function dropC(cid){DB.regs=DB.regs.filter(r=>!(r.studentId==me.sid&&r.courseId==cid&&r.session==SESSION));save();render()}
function printSlip(){try{window.print()}catch(e){msg='Printing is blocked here. Use your browser\'s Print option instead.';render()}}
function studentV(){const s=stu(me.sid),paid=isPaid(s.id),rc=regCourses(s.id),pm=DB.payments.find(p=>p.studentId==s.id&&p.session==SESSION),res=DB.results.filter(r=>r.studentId==s.id&&r.status=='Compiled'),rev=DB.results.filter(r=>r.studentId==s.id&&r.status=='Amended').length;
 return`<div class="card noprint"><h2>School fees, ${SESSION}</h2>${paid?`<p><span class="b Compiled">Paid</span> ₦${FEE.toLocaleString()}. Receipt ${pm.ref}, ${pm.at}</p>`:`<p><span class="b Pending">Unpaid</span> Pay ₦${FEE.toLocaleString()} to unlock course registration.</p><button class="p" onclick="pay()">Pay school fees (demo)</button>`}</div>
<div class="card noprint"><h2>Course registration</h2>${paid?`<div class="sc"><table><tr><th>Course</th><th>Units</th><th></th></tr>${DB.courses.map(c=>{const on=isReg(s.id,c.id);return`<tr><td>${c.code} ${c.title}</td><td>${c.units}</td><td>${on?(hasRes(s.id,c.id)?'<span class="mut">Registered, graded</span>':`<button class="s" onclick="dropC(${c.id})">Drop</button>`):`<button class="s" onclick="regC(${c.id})">Register</button>`}</td></tr>`}).join('')}</table></div>`:'<p class="mut">Pay your school fees first. Course registration opens after payment.</p>'}</div>
<div class="card"><h2>Result slip, ${SESSION}</h2><p>${esc(s.name)}<br>${s.matric}, ${s.dept}, ${s.level} level</p><h3>Registered courses</h3><div class="sc"><table><tr><th>Code</th><th>Title</th><th>Units</th></tr>${rc.map(c=>`<tr><td>${c.code}</td><td>${c.title}</td><td>${c.units}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">No courses registered yet.</td></tr>'}</table></div>
<h3 style="margin-top:14px">Results</h3><div class="sc"><table><tr><th>Result ID</th><th>Course</th><th>Score</th><th>Grade</th><th>Semester</th></tr>${res.map(r=>`<tr><td>RES-${r.id}</td><td>${crs(r.courseId).code}</td><td>${r.score}</td><td>${r.grade}</td><td>${r.semester}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">No approved results yet.</td></tr>'}</table></div>
${rev?`<p class="mut">${rev} result(s) under review are not shown until approved.</p>`:''}<p class="mut">Anyone can check a result with its Result ID in the Ledger Watch verification portal.</p><button class="p noprint" onclick="printSlip()">Print slip</button></div>`}
function verifyV(){const ids=DB.results.filter(r=>r.blockId).map(r=>'RES-'+r.id).concat(DB.certs.map(c=>'CERT-'+c.id));
 return`<div class="card"><h2>Verify a record</h2><p class="mut">No account needed. Enter the Result or Certificate ID given to you by the student.</p><label>Your name or organisation</label><input id="vn" placeholder="e.g. Acme Ltd, HR"><label>Record ID</label><input id="vid" placeholder="RES-1"><button class="p" onclick="doVerify()">Verify record</button><div class="chips"><p class="mut" style="margin:14px 0 0">IDs in this demo:</p>${ids.map(i=>`<button class="s" onclick="$('#vid').value='${i}'">${i}</button>`).join('')}</div></div>${vres?vres:''}`}
async function doVerify(){const id=$('#vid').value.trim().toUpperCase(),who=$('#vn').value.trim()||'Anonymous';let res='NotFound',rec,data,blk,sum='';
 if(id.startsWith('RES-')){rec=DB.results.find(r=>'RES-'+r.id==id&&r.blockId);if(rec){data=recData(rec);blk=DB.blocks.find(b=>b.id==rec.blockId);sum=`${stu(rec.studentId).name}, ${crs(rec.courseId).code} ${crs(rec.courseId).title}: ${rec.score} (${rec.grade}), ${rec.session} ${rec.semester} semester`}}
 else if(id.startsWith('CERT-')){rec=DB.certs.find(c=>'CERT-'+c.id==id);if(rec){data=certData(rec);blk=DB.blocks.find(b=>b.id==rec.blockId);sum=`Certificate for ${stu(rec.studentId).name} (${stu(rec.studentId).matric}), issued ${rec.date}`}}
 let re='';if(rec&&blk){re=await sha(data+blk.prev+blk.nonce);const own=await sha(blk.data+blk.prev+blk.nonce);res=re===blk.hash&&own===blk.hash?'Authentic':'Altered'}
 DB.log.unshift({id:DB.log.length+1,rec:id||'(empty)',who,at:new Date().toISOString().slice(0,16).replace('T',' '),res});save();
 const say={Authentic:'✅ Authentic. This record matches the blockchain.',Altered:'⚠️ Altered. This record no longer matches what was locked on the blockchain.',NotFound:'❌ Not found. No record with that ID exists.'}[res];
 const am=id.startsWith('RES-')&&rec?DB.audit.filter(a=>a.resId==rec.id&&a.action=='Re-approved').length:0;vres=`<div class="verdict ${res}">${say}</div>`+(blk?`<div class="card"><p>${esc(sum)}</p>${rec.status=='Amended'?'<p class="mut">A grade change on this record is waiting for Records Unit approval.</p>':''}${am?`<p class="mut">This record was changed and re-approved ${am} time(s). Each change is in the audit trail.</p>`:''}<div class="hs"><div><b>Stored on blockchain (block ${blk.id})</b><br><span class="h">${blk.hash}</span></div><div><b>Recalculated from record now</b><br><span class="h" style="color:${res=='Authentic'?'var(--ok)':'var(--bd)'}">${re}</span></div></div></div>`:'');render()}
init();
</script></body></html>
